<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DeckAway">
<meta name="theme-color" content="#1e1e1e">
<link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<title>DeckAway · вход</title>
<script id="theme_boot">/* The panel's theme (frontend/theme.js), chosen in this browser, applies to this page too. */
try{const t=localStorage.getItem("cc.theme");document.documentElement.dataset.theme=t==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):/^(light|black|dusk|mint)$/.test(t)?t:"dark"}catch(e){}</script>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--fg:#d4d4d4;--fg2:#ececec;--mut:#8a8a8e;--bd:#38383d;--field:#252526;--acc:#0a84ff;--acc-strong:#0a84ff;--bad:#ff6b61;--shadow:rgba(0,0,0,.4);--r:10px;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light;--bg:#fbf7f1;--fg:#3b332c;--fg2:#231d18;--mut:#6a5f55;--bd:#e9dfd2;--field:#fffdf9;--acc:#e0694a;--acc-strong:#c4512f;--bad:#b42a1e;--shadow:rgba(90,60,30,.16);--r:14px;
  --sans:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Nunito","Segoe UI",system-ui,sans-serif}
:root[data-theme=black]{--bg:#000;--bd:#2a2a2d;--field:#121214}
:root[data-theme=dusk]{--bg:#232838;--fg:#d5dbea;--fg2:#eef1f8;--mut:#a3abc2;--bd:#3d4560;--field:#1c2030;--acc:#8b93ff;--acc-strong:#5b5fd0;--bad:#ff8d97;--shadow:rgba(5,8,20,.5);--r:12px}
:root[data-theme=mint]{color-scheme:light;--bg:#f2f7f6;--fg:#2b3a37;--fg2:#152320;--mut:#53635f;--bd:#dae7e4;--field:#fff;--acc:#14a38b;--acc-strong:#0b7a68;--bad:#b02a3a;--shadow:rgba(20,60,55,.14);--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans)}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top))}
.box{width:100%;max-width:340px}
.logo{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto 18px;box-shadow:0 8px 24px var(--shadow)}
h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 24px;color:var(--fg2)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--bd);background:var(--field);color:var(--fg2);outline:none;margin-bottom:14px;-webkit-appearance:none}
input:focus{border-color:var(--acc)}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:var(--r);background:var(--acc-strong);color:#fff;margin-top:6px;cursor:pointer}
button:active{opacity:.85}
.err{min-height:20px;color:var(--bad);font-size:13px;text-align:center;margin-bottom:10px}
.help{margin-top:22px;font-size:13px;color:var(--mut)}
.help summary{cursor:pointer;text-align:center;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help p{margin:10px 0 8px}
.help code{display:block;padding:10px 12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--field);color:var(--fg2);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;user-select:all;-webkit-user-select:all}
</style></head><body>
<form class="box" method="post" action="/login">
  <img class="logo" src="/icon-180.png" alt="">
  <h1>DeckAway</h1>
  <div class="err">{{ERROR}}</div>
  <label for="u">Логин</label>
  <input id="u" name="username" type="text" value="{{USER}}" autofocus autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Войти</button>
  <details class="help"><summary>Где взять логин и пароль?</summary>
    <p>Их показал установщик в конце, в окне терминала. Если окно уже закрыто, выполните в терминале компьютера с DeckAway (на Windows — в PowerShell):</p>
    <code>{{SHOW_AGAIN}}</code></details>
</form>
</body></html>
